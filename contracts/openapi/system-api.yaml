openapi: 3.0.3
info:
  title: Cosmetic Ecommerce Internal System API
  version: 0.1.0
  description: >-
    API contract for the implemented recommendation backend. Operations marked
    PLANNED describe future boundaries and are not production-ready endpoints.
servers:
  - url: http://localhost:8080/api
    description: Backend/API gateway
  - url: http://localhost:8001
    description: Direct recommendation-service during local development
paths:
  /health:
    get:
      summary: Recommendation service liveness
      tags: [Operations]
      x-implementation-status: IMPLEMENTED
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      summary: Recommendation service readiness
      tags: [Operations]
      x-implementation-status: IMPLEMENTED
      responses:
        "200":
          description: Catalog and required dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Catalog or required database is unavailable
  /products:
    get:
      summary: List products from the recommendation-ready catalog
      tags: [Catalog]
      x-implementation-status: IMPLEMENTED
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          schema:
            type: string
            maxLength: 80
        - name: brand
          in: query
          schema:
            type: string
            maxLength: 80
        - name: limit
          in: query
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated product catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /products/{productId}:
    get:
      summary: Get one catalog product
      tags: [Catalog]
      x-implementation-status: IMPLEMENTED
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /auth/register:
    post:
      summary: Register a CUSTOMER account
      tags: [Authentication]
      x-implementation-status: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
  /auth/login:
    post:
      summary: Authenticate with email and password
      tags: [Authentication]
      x-implementation-status: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/profile:
    get:
      summary: Get the authenticated user profile
      tags: [Authentication]
      x-implementation-status: IMPLEMENTED
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Invalid or expired token
  /orders:
    post:
      summary: Create an order using authoritative catalog prices
      tags: [Orders]
      x-implementation-status: IMPLEMENTED
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Authentication required
        "422":
          description: Invalid product, stock, or currency
    get:
      summary: List orders owned by the authenticated user
      tags: [Orders]
      x-implementation-status: IMPLEMENTED
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User order history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
  /admin/orders:
    get:
      summary: List all orders as ADMIN
      tags: [Orders, Admin]
      x-implementation-status: IMPLEMENTED
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "403":
          description: ADMIN role required
  /admin/dashboard:
    get:
      summary: Get operational dashboard metrics as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Dashboard metrics from authoritative database data
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminDashboard"}
        "403": {description: ADMIN role required}
  /admin/data-quality:
    get:
      summary: Get catalog field coverage across all products as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Authoritative product data-quality counters}
        "403": {description: ADMIN role required}
  /admin/products:
    get:
      summary: Search and paginate all products as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [ACTIVE, INACTIVE, DRAFT, ARCHIVED]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200": {description: Paginated admin product list}
        "403": {description: ADMIN role required}
    post:
      summary: Create a product as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminProductPayload"}
      responses:
        "201": {description: Product created}
        "422": {description: Invalid product or AI-ready requirements not met}
  /admin/products/{productId}:
    parameters:
      - {name: productId, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: Get one product as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Admin product detail}
        "404": {description: Product not found}
    put:
      summary: Update a product as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdminProductPayload"}
      responses:
        "200": {description: Product updated}
        "404": {description: Product not found}
  /admin/products/{productId}/status:
    patch:
      summary: Update product publication status as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      parameters:
        - {name: productId, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [ACTIVE, INACTIVE, DRAFT, ARCHIVED]}
      responses:
        "200": {description: Product status updated}
  /admin/products/{productId}/stock:
    patch:
      summary: Update product stock as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      parameters:
        - {name: productId, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stockQuantity]
              properties:
                stockQuantity: {type: integer, minimum: 0}
      responses:
        "200": {description: Product stock updated}
  /admin/inventory:
    get:
      summary: List inventory as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Inventory product list}
  /admin/orders/{orderId}:
    get:
      summary: Get one order as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Order detail}
        "404": {description: Order not found}
  /admin/orders/{orderId}/status:
    patch:
      summary: Advance order status as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [PENDING, CONFIRMED, PROCESSING, SHIPPING, COMPLETED, CANCELED]}
      responses:
        "200": {description: Order status updated}
        "409": {description: Invalid status transition}
  /admin/users:
    get:
      summary: Search users as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      responses:
        "200": {description: User list without credential fields}
  /admin/users/{userId}:
    get:
      summary: Get user profile, preferences and orders as ADMIN
      tags: [Admin]
      x-implementation-status: IMPLEMENTED
      security: [{bearerAuth: []}]
      parameters:
        - {name: userId, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Admin-safe user detail}
        "404": {description: User not found}
  /behavior-events:
    post:
      summary: Track a user behavior event
      tags: [Behavior Tracking]
      x-implementation-status: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BehaviorEventRequest"
      responses:
        "202":
          description: Event accepted
        "404":
          description: Product not found
        "422":
          description: Schema validation failed
        "503":
          description: Database integration unavailable
  /recommendations/personalized:
    post:
      summary: Get personalized product recommendations
      tags: [Recommendation]
      x-implementation-status: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationRequest"
      responses:
        "200":
          description: Recommendation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "422":
          description: Schema validation failed
        "503":
          description: Required database unavailable
  /recommendations/similar-products/{productId}:
    get:
      summary: Get products similar to a selected product
      tags: [Recommendation]
      x-implementation-status: IMPLEMENTED
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Similar product result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "404":
          description: Product not found
        "422":
          description: Invalid productId or limit
  /recommendations/explain:
    post:
      summary: Explain why a product is recommended
      tags: [Recommendation]
      x-implementation-status: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RecommendationRequest"
                - type: object
                  required: [productId]
                  properties:
                    productId:
                      type: integer
                      minimum: 1
                      description: Product primary key in the products table when DB integration is enabled.
      responses:
        "200":
          description: Recommendation explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendedProduct"
        "404":
          description: Product or explanation not found
        "422":
          description: Schema validation failed
        "503":
          description: Required database unavailable
  /chatbot/messages:
    post:
      summary: Send a message to the consultation chatbot
      tags: [Chatbot]
      x-implementation-status: PLANNED
      description: Future extension. No chatbot production endpoint is implemented in the current repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatbotMessageRequest"
      responses:
        "200":
          description: Chatbot response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotMessageResponse"
  /analytics/dashboard-summary:
    get:
      summary: Get admin dashboard summary metrics
      tags: [Analytics]
      x-implementation-status: PLANNED
      description: Future extension. No analytics production endpoint is implemented in the current repository.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdminDashboard:
      type: object
      required: [totalProducts, aiReadyProducts, lowStockProducts, users, orders, pendingOrders, ordersToday, recommendationRequests, orderStatuses, revenueByCurrency]
      properties:
        totalProducts: {type: integer, minimum: 0}
        aiReadyProducts: {type: integer, minimum: 0}
        lowStockProducts: {type: integer, minimum: 0}
        users: {type: integer, minimum: 0}
        orders: {type: integer, minimum: 0}
        pendingOrders: {type: integer, minimum: 0}
        ordersToday: {type: integer, minimum: 0}
        recommendationRequests: {type: integer, minimum: 0}
        orderStatuses: {type: object, additionalProperties: {type: integer}}
        revenueByCurrency: {type: object, additionalProperties: {type: number}}
    AdminProductPayload:
      type: object
      required: [sku, name, brand, category, price, currency, stockQuantity, status, aiReady]
      properties:
        sku: {type: string}
        name: {type: string}
        brand: {type: string}
        category: {type: string}
        price: {type: number, exclusiveMinimum: 0}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        stockQuantity: {type: integer, minimum: 0}
        status: {type: string, enum: [ACTIVE, INACTIVE, DRAFT, ARCHIVED]}
        aiReady: {type: boolean}
        description: {type: string}
        benefits: {type: string}
        inciIngredients: {type: string}
        keyIngredients: {type: string}
        skinTypes: {type: array, items: {type: string}}
        skinConcerns: {type: array, items: {type: string}}
        careGoals: {type: array, items: {type: string}}
        texture: {type: string}
        usageInstruction: {type: string}
        warnings: {type: string}
        imageUrl: {type: string}
        sourceUrl: {type: string}
    Product:
      type: object
      required: [productId, sku, name, brand, category, skinTypes, skinConcerns, careGoals]
      properties:
        productId:
          type: integer
          minimum: 1
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        price:
          type: number
          nullable: true
        currency:
          type: string
          nullable: true
        description:
          type: string
        benefits:
          type: string
        inciIngredients:
          type: string
        keyIngredients:
          type: string
        skinTypes:
          type: array
          items:
            type: string
        skinConcerns:
          type: array
          items:
            type: string
        careGoals:
          type: array
          items:
            type: string
        texture:
          type: string
        imageUrl:
          type: string
          format: uri
        sourceUrl:
          type: string
          format: uri
        stockQuantity:
          type: integer
          minimum: 0
          nullable: true
    ProductListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UserProfile:
      type: object
      required: [userId, fullName, email, role]
      properties:
        userId:
          type: integer
          minimum: 1
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
        skinType:
          type: string
          nullable: true
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [bearer]
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/UserProfile"
    OrderCreateRequest:
      type: object
      required: [items, currency, shippingName, shippingPhone, shippingAddress]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: integer
                minimum: 1
              quantity:
                type: integer
                minimum: 1
                maximum: 99
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        shippingName:
          type: string
        shippingPhone:
          type: string
        shippingAddress:
          type: string
        note:
          type: string
          nullable: true
        paymentMethod:
          type: string
          enum: [COD, BANK_TRANSFER]
          default: COD
    Order:
      type: object
      required: [orderId, userId, status, totalAmount, currency, items]
      properties:
        orderId:
          type: integer
        userId:
          type: integer
        status:
          type: string
          enum: [PENDING, CONFIRMED, SHIPPING, COMPLETED, CANCELED]
        totalAmount:
          type: number
        currency:
          type: string
        shippingName:
          type: string
        shippingPhone:
          type: string
        shippingAddress:
          type: string
        note:
          type: string
          nullable: true
        paymentMethod:
          type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required: [productId, productName, quantity, unitPrice]
            properties:
              productId:
                type: integer
              productName:
                type: string
              quantity:
                type: integer
              unitPrice:
                type: number
    OrderListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
    BehaviorEventRequest:
      type: object
      required: [eventType]
      description: Requires either userId or sessionId. Product-level events require productId.
      properties:
        userId:
          type: integer
          minimum: 1
          nullable: true
        sessionId:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
          description: Trimmed before persistence. Required for anonymous behavior events when userId is absent; whitespace-only values are invalid.
        productId:
          type: integer
          minimum: 1
          nullable: true
          description: Product primary key. Required for view_product, click_recommendation, add_favorite, add_to_cart, remove_from_cart, place_order, and review_product.
        eventType:
          type: string
          enum:
            - view_product
            - search_keyword
            - filter_used
            - click_recommendation
            - add_favorite
            - add_to_cart
            - remove_from_cart
            - place_order
            - review_product
            - chatbot_message
        eventValue:
          type: number
          format: double
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
          nullable: true
    RecommendationRequest:
      type: object
      properties:
        userId:
          type: integer
          minimum: 1
          nullable: true
        sessionId:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
          description: Trimmed before use. Used to load anonymous behavior history when userId is absent; whitespace-only values are ignored.
        limit:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
        context:
          type: object
          properties:
            skinType:
              type: string
              enum: [normal, dry, oily, combination, sensitive]
            skinConcerns:
              type: array
              items:
                type: string
                enum: [acne, dark_spot, dryness, aging, redness, large_pores, dullness, uneven_texture, oiliness, sensitivity]
            careGoals:
              type: array
              items:
                type: string
                enum: [cleanse, hydrate, brighten, anti_acne, anti_aging, repair, soothe, oil_control, sun_protection, exfoliate]
            budgetMin:
              type: number
              minimum: 0
              description: Must be less than or equal to budgetMax when both are provided.
            budgetMax:
              type: number
              minimum: 0
              description: Must be greater than or equal to budgetMin when both are provided.
            budgetCurrency:
              type: string
              pattern: "^[A-Z]{3}$"
              example: USD
              description: Required whenever budgetMin or budgetMax is provided.
            preferredCategories:
              type: array
              items:
                type: string
                enum: [cleanser, toner, serum, moisturizer, sunscreen, exfoliant, mask, makeup_remover, eye_care, lip_care, body_care]
            preferredBrands:
              type: array
              items:
                type: string
            avoidIngredients:
              type: array
              items:
                type: string
        behaviors:
          type: array
          description: Optional inline behavior events. When DB integration is enabled, the service also loads stored behavior history by userId/sessionId.
          items:
            $ref: "#/components/schemas/RecommendationBehaviorEvent"
        excludeProductIds:
          type: array
          items:
            type: integer
            minimum: 1
          description: Product IDs to exclude from recommendations.
    RecommendationBehaviorEvent:
      type: object
      required: [eventType]
      properties:
        eventType:
          type: string
          enum:
            - view_product
            - search_keyword
            - filter_used
            - click_recommendation
            - add_favorite
            - add_to_cart
            - remove_from_cart
            - place_order
            - review_product
            - chatbot_message
        productId:
          type: integer
          minimum: 1
          nullable: true
          description: Product primary key. Required for product-level and place_order events.
        eventValue:
          type: number
          format: double
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
          nullable: true
    RecommendedProduct:
      type: object
      required: [productId, score, reasons, status, scoreBreakdown]
      properties:
        productId:
          type: integer
          minimum: 1
        score:
          type: number
          format: double
        reasons:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [RANKED, NOT_RANKED, FILTERED_OUT]
        scoreBreakdown:
          type: object
          additionalProperties:
            type: number
    RecommendationResponse:
      type: object
      required: [algorithm, weights, items, candidateCount, filteredCandidateCount]
      properties:
        algorithm:
          type: string
          example: knowledge_content_hybrid
        weights:
          type: object
