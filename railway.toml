[build]
builder = "NIXPACKS"
buildCommand = "python -m pip install --no-cache-dir -r services/recommendation-service/requirements.txt"

[deploy]
startCommand = "python -m uvicorn recommendation_service.api:app --app-dir services/recommendation-service --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
